name: Build ISO
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
      options: --privileged
    defaults:
      run:
        working-directory: myos-debian-gnome/myos
    steps:
      - uses: actions/checkout@v4
      - name: Install live-build
        run: apt-get update && apt-get install -y live-build
      - name: Build
        run: |
          chmod +x auto/config config/hooks/normal/*.chroot
          lb config
          lb build
      - uses: actions/upload-artifact@v4
        with:
          name: my-debian-iso
          path: myos-debian-gnome/myos/*.iso
